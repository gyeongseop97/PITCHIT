if(end){out=changeSide(out);nextBatter()}$("result").textContent=out;$("art").className="art show "+k;render();$("reveal").textContent="⚾ 실제 투구 위치가 표시됩니다."};render();

</style><script id="mobile-invite-reveal-v1">
const friendLobbyBeforeMobileInvite=friendLobby;
friendLobby=function(){
  friendLobbyBeforeMobileInvite();
  const box=document.getElementById('friendLobby'),create=document.getElementById('createRoom'),status=document.getElementById('friendStatus');
  requestAnimationFrame(()=>box?.scrollIntoView({behavior:'smooth',block:'start'}));
  if(!create||!status)return;
  create.onclick=async()=>{
    create.disabled=true;create.textContent='코드 생성 중…';status.textContent='대전 방을 만들고 있습니다…';
    try{
      const data=await requestMatch({action:'create',name:document.getElementById('friendName').value});
      matchSession={code:data.code,token:data.token,player:data.player};box.classList.add('codeReady');
      status.textContent='초대 코드를 친구에게 보내세요. 친구 입장을 기다리는 중입니다.';
      let card=document.getElementById('inviteCodeCard');if(!card){card=document.createElement('div');card.id='inviteCodeCard';status.after(card)}card.textContent=data.code;
      box.scrollIntoView({behavior:'smooth',block:'center'});watchInviteRoom();
    }catch(error){status.textContent=error.message||'초대 코드 생성에 실패했습니다. 다시 시도해 주세요.'}
    finally{create.disabled=false;create.textContent='초대 코드 생성'}
  };
};
document.querySelector('[data-mode="friend"]').onclick=friendLobby;
function watchInviteRoom(){
  clearInterval(matchPoll);
  matchPoll=setInterval(async()=>{
    if(!matchSession)return;
    try{const data=await requestMatch({action:'state',code:matchSession.code,token:matchSession.token});if(data.ready)beginMatch(data)}catch(error){clearInterval(matchPoll)}
  },700);
}
watchMatch=async function(){
  clearInterval(matchPoll);
  matchPoll=setInterval(async()=>{
    if(!matchSession)return;
    try{
      const data=await requestMatch({action:'state',code:matchSession.code,token:matchSession.token});
      if(data.ready)beginMatch(data);
      else{
        const box=document.getElementById('friendLobby'),status=document.getElementById('friendStatus');
        if(status&&!box?.classList.contains('codeReady'))status.textContent=`초대 코드: ${matchSession.code} · 친구의 입장을 기다리는 중`;
      }
    }catch(error){clearInterval(matchPoll)}
  },700);
};
