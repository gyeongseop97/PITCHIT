<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PITCHIT — Pitch it. Hit it.</title>
  <style>
    :root{--ink:#11233f;--red:#d83a30;--paper:#f7f0df;--line:#d8d0bc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;background:#fffaf0;padding:22px}.brand{width:180px;height:50px;overflow:hidden;border-radius:7px;background:#050505}.brand img{width:180px;transform:translateY(-61px)}h1{font-size:30px;margin:25px 0 4px}.sub{color:#667487;font-size:14px}.tabs,.choices{display:flex;gap:8px;margin:18px 0}.tabs button,.choices button{flex:1;border:1px solid var(--line);background:#fff;padding:12px;color:var(--ink);font-weight:800;text-align:left;cursor:pointer}.tabs .on,.choices .on{background:var(--ink);color:#fff;box-shadow:inset 0 -4px var(--red)}.choices small{display:block;margin-top:6px;font-weight:400;opacity:.75}.label{font-weight:800;margin-top:26px}.hint{font-size:13px;color:#687583;margin:6px 0 12px}.zone{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));width:min(420px,calc(100vw - 44px));height:min(420px,calc(100vw - 44px));margin:auto;background:url('pitchit-strike-zone.png') center/100% 100% no-repeat}.zone button{z-index:1;aspect-ratio:1;min-height:0;border:1px solid transparent;background:transparent;cursor:pointer}.zone .range{background:#f7d2b988}.zone .chosen{background:#e98245c9;color:#fff;font-size:22px;box-shadow:inset 0 0 0 2px #fff}.zone.pitch .chosen{background:#bf5a10c9}.zone .actual{background:transparent!important;outline:0;font-size:30px;filter:drop-shadow(0 2px 2px #11233f88)}.action{width:100%;border:0;background:var(--red);color:#fff;padding:17px;margin:22px 0 12px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #8f251e}.result{padding:13px;border-left:4px solid var(--red);background:#f0e6d2;font-weight:800;min-height:48px}.resultArt{display:none;position:relative;margin-top:12px;aspect-ratio:2.15;border-radius:8px;overflow:hidden;background-image:linear-gradient(90deg,rgba(17,35,63,.62),transparent 62%),url('pitchit-result-sprite.png');background-size:auto 100%;background-position:0 center;box-shadow:0 8px 20px #11233f24}.resultArt.show{display:block}.resultArt b{position:absolute;left:18px;bottom:15px;color:#fff;font-size:22px;letter-spacing:.04em;text-shadow:0 2px 4px #000}.resultArt.strike,.resultArt.ball{background-position:0 center}.resultArt.out{background-position:33.33% center}.resultArt.hit{background-position:100% center}.resultArt.homerun{background-position:100% center;filter:saturate(1.35)}.reveal{text-align:center;font-weight:800;color:#12345a;font-size:13px}.count{display:flex;justify-content:center;gap:25px;background:var(--ink);color:#fff;margin:28px -22px -22px;padding:14px;font-weight:800}@media(max-width:560px){.choices{flex-wrap:wrap}.choices button{min-width:calc(50% - 4px)}.app{padding:18px}.count{margin:28px -18px -18px}.zone{width:min(340px,calc(100vw - 36px));height:min(340px,calc(100vw - 36px))}}
    /* Final layout: white canvas and overlay aligned to the illustrated inner zone. */
    body{background:#fff} .app{background:#fff;max-width:760px}#home{min-height:86vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;background:linear-gradient(110deg,#fff 0%,#fff 55%,#f4f7fa 100%);padding:36px}.eyebrow{color:var(--red);font-size:12px;font-weight:900;letter-spacing:.2em;margin:34px 0 12px}#home h1{font-size:clamp(42px,8vw,68px);line-height:.96;margin:0}#home h1 em{font-style:normal;color:var(--red)}.lead{max-width:460px;line-height:1.7;color:#536170}.start{border:0;background:var(--red);color:#fff;padding:17px 26px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #8f251e;cursor:pointer;margin-top:22px}body.home .app>:not(#home){display:none}body:not(.home) #home{display:none}.zone{display:block;background:url('pitchit-strike-zone.png') center/100% 100% no-repeat}.zoneCells{position:absolute;left:19.5%;top:17.5%;width:61.5%;height:60%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr)}.zoneCells button{z-index:1;aspect-ratio:1;min-height:0;border:1px solid transparent;background:transparent;cursor:pointer}.zoneCells .range{background:#f7d2b988}.zoneCells .chosen{background:#e98245c9;color:#fff;font-size:22px;box-shadow:inset 0 0 0 2px #fff}.zoneCells .actual{background:transparent!important;outline:0;font-size:30px;filter:drop-shadow(0 2px 2px #11233f88)}
    /* White visual system: a decorative image never defines playable cell boundaries. */
    #home{background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.88) 52%,rgba(255,255,255,.18) 100%),url('pitchit-hero-white.png') right center/cover no-repeat}.modeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(620px,100%);margin-top:22px}.modeGrid button{min-height:108px;text-align:left}.modeGrid small{display:block;margin-top:9px;font-weight:400;opacity:.8}.mode{border:1px solid #d7dee7;background:#fff;color:var(--ink);padding:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #d8dee8}.mode.navy{background:var(--ink);color:#fff;box-shadow:0 5px 0 #77869a}.zone{background:url('pitchit-strike-zone-white.png') center/100% 100% no-repeat}.zoneCells{left:14%;top:14%;width:72%;height:72%;background:rgba(255,255,255,.92);border:2px solid #173657}.zoneCells button{border-right:1px solid #6e8298;border-bottom:1px solid #6e8298}.zoneCells button:nth-child(5n){border-right:0}.zoneCells button:nth-child(n+21){border-bottom:0}@media(max-width:560px){.modeGrid{grid-template-columns:1fr}.modeGrid button{min-height:74px}}
    .scoreStrip{display:grid;grid-template-columns:92px 1fr 128px 76px;align-items:center;gap:14px;margin:28px -22px -22px;padding:14px 22px;background:#102846;color:#fff}.inningBox,.score{text-align:center}.inningBox small,.score small{display:block;font-size:10px;letter-spacing:.12em;opacity:.7}.inningBox b,.score b{font-size:28px}.inningBox span{font-size:12px;margin-left:3px}.bases{width:52px;height:52px;position:relative;margin:auto;transform:rotate(45deg)}.bases i{position:absolute;width:15px;height:15px;border:2px solid #bfccda;background:#102846}.bases i:nth-child(1){left:18px;top:0}.bases i:nth-child(2){left:0;top:18px}.bases i:nth-child(3){right:0;top:18px}.bases i.on{background:#efbb3f;border-color:#fff}.lights{display:flex;gap:7px;justify-content:center}.lights span{display:grid;place-items:center;width:33px;height:33px;border:1px solid #6b8198;border-radius:50%;font-size:10px}.lights b{font-size:15px;color:#fff}@media(max-width:560px){.scoreStrip{grid-template-columns:68px 1fr 112px 55px;gap:6px;margin:28px -18px -18px;padding:12px}.bases{transform:scale(.8) rotate(45deg)}.lights{gap:3px}.lights span{width:29px;height:29px}}
  </style>
</head>
<body>
  <main class="app"><section id="home"><div class="brand"><img src="pitchit-logo-v2.png" alt="PITCHIT" /></div><p class="eyebrow">BASEBALL MIND GAME</p><h1>한 구에 담긴<br><em>읽고, 속이는 승부.</em></h1><p class="lead">5×5 스트라이크존에서 작전을 고르고, 상대의 심리를 읽어 승부하세요.</p><div class="modeGrid"><button class="start" id="startGame">싱글 플레이<small>AI와 타격·투구 연습</small></button><button class="mode navy" id="quickMode">빠른 대전<small>실시간 자동 매칭 · 준비 중</small></button><button class="mode" id="friendMode">친구와 플레이<small>초대 코드 대전 · 준비 중</small></button></div></section><div class="brand"><img src="pitchit-logo-v2.png" alt="PITCHIT" /></div><h1 id="title">타격 작전</h1><p class="sub" id="description">스윙 유형과 노림 칸을 선택하세요.</p><div class="tabs"><button id="batTab" class="on">타격</button><button id="pitchTab">투구</button></div><div class="label" id="stepOne">1. 스윙 유형</div><p class="hint" id="hintOne">컨택 스윙은 선택 칸 주변 3×3, 총 9칸을 공략합니다.</p><div class="choices" id="choices"></div><div class="label" id="stepTwo">2. 노림 칸</div><p class="hint" id="hintTwo">투구 위치와 가까울수록 정확한 타격이 됩니다.</p><div class="zone" id="zone"></div><p class="reveal" id="reveal"></p><button class="action" id="action">이 칸을 노리고 스윙</button><p class="result" id="result">준비 완료. 첫 작전을 선택하세요.</p><div class="resultArt" id="resultArt"><b></b></div><section class="scoreStrip"><div class="inningBox"><small>INNING</small><b id="inning">1</b><span>초</span></div><div class="bases" aria-label="현재 주자"><i id="base2"></i><i id="base3"></i><i id="base1"></i></div><div class="lights"><span>B <b id="balls">0</b></span><span>S <b id="strikes">0</b></span><span>O <b id="outs">0</b></span></div><div class="score"><small>PLAYER</small><b id="score">0</b></div></section></main>
  <script>
    const state={role:'bat',swing:'contact',type:'fastball',target:[2,2],last:null,b:0,s:0,o:0,score:0,inning:1,bases:[false,false,false]};
    const swings=[['power','파워 스윙','중심 + 상하좌우 5칸'],['contact','컨택 스윙','주변 3×3 · 9칸'],['vertical','세로 노려치기','같은 세로줄 공략'],['horizontal','가로 노려치기','같은 가로줄 공략'],['spot','스팟 스윙','한 칸 정밀 공략']];
    const pitchTypes=[['fastball','직구','스윙 유도↓ · 장타 위험↓'],['breaking','변화구','스윙 유도↑ · 장타 위험↑']];
    const $=id=>document.getElementById(id), dist=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
    function inRange(z){const t=state.target,d=dist(z,t);if(state.swing==='contact')return Math.abs(z[0]-t[0])<=1&&Math.abs(z[1]-t[1])<=1;if(state.swing==='power')return d<=1;if(state.swing==='vertical')return z[1]===t[1];if(state.swing==='horizontal')return z[0]===t[0];return d===0}
    function render(){const bat=state.role==='bat';$('title').textContent=bat?'타격 작전':'투구 작전';$('description').textContent=bat?'볼에는 스윙하지 않습니다.':'투구 뒤 상대 타자의 노림 칸이 공개됩니다.';$('batTab').className=bat?'on':'';$('pitchTab').className=!bat?'on':'';$('stepOne').textContent=bat?'1. 스윙 유형':'1. 구종 선택';$('hintOne').textContent=bat?'컨택 스윙은 선택 칸 주변 3×3, 총 9칸을 공략합니다.':'직구는 장타 위험이 낮고, 변화구는 헛스윙을 더 유도합니다.';$('stepTwo').textContent=bat?'2. 노림 칸':'2. 투구 위치';$('hintTwo').textContent=bat?'투구 위치와 가까울수록 정확한 타격이 됩니다.':'가장자리일수록 볼 또는 제구 이탈 가능성이 높습니다.';$('choices').innerHTML=(bat?swings:pitchTypes).map(x=>`<button data-id="${x[0]}" class="${(bat?state.swing:state.type)===x[0]?'on':''}">${x[1]}<small>${x[2]}</small></button>`).join('');document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>{bat?state.swing=b.dataset.id:state.type=b.dataset.id;render()});const selected=state.target;$('zone').className='zone '+(bat?'':'pitch');$('zone').innerHTML='<div class="zoneCells">'+Array.from({length:25},(_,i)=>{const z=[Math.floor(i/5),i%5],on=z[0]===selected[0]&&z[1]===selected[1],actual=state.last&&z[0]===state.last[0]&&z[1]===state.last[1];return `<button class="${on?'chosen':''} ${bat&&!on&&inRange(z)?'range':''} ${actual?'actual':''}" data-z="${z}">${actual?'⚾':on?'●':''}</button>`}).join('');document.querySelectorAll('#zone button').forEach(b=>b.onclick=()=>{state.target=b.dataset.z.split(',').map(Number);state.last=null;render()});$('action').textContent=bat?'이 칸을 노리고 스윙':`${state.type==='fastball'?'직구':'변화구'}로 이 칸에 투구`;$('reveal').textContent=state.last?(bat?'⚾ 실제 투구 위치':'⚾ 상대 타자의 노림 칸'):'';$('balls').textContent=state.b;$('strikes').textContent=state.s;$('outs').textContent=state.o}
    function play(){const bat=state.role==='bat';const opponent=[Math.floor(Math.random()*5),Math.floor(Math.random()*5)];state.last=opponent;const match=bat&&inRange(opponent),edge=Math.max(Math.abs(opponent[0]-2),Math.abs(opponent[1]-2)),ball=Math.random()<.08+edge*.12;if(ball){state.b=Math.min(4,state.b+1);$('result').textContent='볼 — 볼에는 스윙이 없습니다.'}else if(!bat){$('result').textContent=`${state.type==='fastball'?'직구':'변화구'} 투구 완료 — 상대 노림 칸을 확인하세요.`}else{const hit=Math.random()<(match?.66:.30);if(hit)$('result').textContent=Math.random()<.17?'홈런! 노린 존을 완벽히 공략했습니다.':'안타! 타격이 살아났습니다.';else{state.s=Math.min(3,state.s+1);$('result').textContent='스트라이크 · 타이밍을 다시 맞춰보세요.'}}render()}
    $('batTab').onclick=()=>{state.role='bat';state.last=null;render()};$('pitchTab').onclick=()=>{state.role='pitch';state.last=null;render()};$('action').onclick=play;document.body.classList.add('home');$('startGame').onclick=()=>{document.body.classList.remove('home');render()};render();
  </script>
  <script>
    function showOutcome(kind, text) {
      const art = document.getElementById('resultArt');
      art.className = `resultArt show ${kind}`;
      art.querySelector('b').textContent = text;
      document.getElementById('result').textContent = text;if(text.includes('홈런')){state.score++;state.bases=[false,false,false]}else if(text.includes('3루타')){state.bases=[false,false,true]}else if(text.includes('2루타')){state.bases=[false,true,false]}else if(text.includes('안타')){state.bases=[true,false,false]}
    }
    document.getElementById('action').onclick = () => {
      const bat = state.role === 'bat';
      const pitch = [Math.floor(Math.random() * 5), Math.floor(Math.random() * 5)];
      state.last = pitch;
      if (!bat) {
        const names = state.type === 'fastball' ? ['스트라이크', '땅볼 아웃', '뜬공 아웃'] : ['헛스윙 삼진', '파울', '안타'];
        const result = names[Math.floor(Math.random() * names.length)];
        showOutcome(result.includes('아웃') || result.includes('삼진') ? 'out' : result === '안타' ? 'hit' : 'strike', `${result} · 상대 노림 칸을 공개합니다.`);
      } else {
        const matched = inRange(pitch);
        const roll = Math.random();
        if (roll < .14) { state.b = Math.min(4, state.b + 1); showOutcome('ball', '볼 · 존을 벗어난 공입니다.'); }
        else if (!matched) { state.s = Math.min(3, state.s + 1); showOutcome('strike', state.s >= 3 ? '삼진 아웃 · 노린 존에서 크게 벗어났습니다.' : '스트라이크 · 노린 범위 밖의 공입니다.'); }
        else if (roll > .42) {
          const outcomes = ['안타', '2루타', '3루타', '홈런'];
          const result = outcomes[Math.min(3, Math.floor(Math.random() * 4))];
          showOutcome(result === '홈런' ? 'homerun' : 'hit', `${result}! 노린 코스를 공략했습니다.`);
        } else if (roll < .32) { state.s = Math.min(3, state.s + 1); showOutcome('strike', state.s >= 3 ? '삼진 아웃 · 타이밍을 놓쳤습니다.' : '스트라이크 · 다음 공을 노려보세요.'); }
        else { showOutcome('out', Math.random() < .5 ? '땅볼 아웃 · 수비 정면입니다.' : '뜬공 아웃 · 높이 떴습니다.'); }
      }
      render();
    };
  </script>
  <script>
    const priorOutcome = showOutcome;
    function refreshScoreboard() {
      document.getElementById('score').textContent = state.score || 0;
      ['base1','base2','base3'].forEach((id, index) => document.getElementById(id).classList.toggle('on', Boolean(state.bases && state.bases[index])));
    }
    showOutcome = (kind, text) => {
      priorOutcome(kind, text);
      if (text.includes('홈런')) { state.score = (state.score || 0) + 1; state.bases = [false,false,false]; }
      else if (text.includes('3루타')) state.bases = [false,false,true];
      else if (text.includes('2루타')) state.bases = [false,true,false];
      else if (text.includes('안타')) state.bases = [true,false,false];
      refreshScoreboard();
    };
    refreshScoreboard();
  </script>
</body>
</html>
