<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PITCHIT — Pitch it. Hit it.</title>
  <style>
    :root{--ink:#11233f;--red:#d83a30;--paper:#f7f0df;--line:#d8d0bc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;background:#fffaf0;padding:22px}.brand{width:180px;height:50px;overflow:hidden;border-radius:7px;background:#050505}.brand img{width:180px;transform:translateY(-61px)}h1{font-size:30px;margin:25px 0 4px}.sub{color:#667487;font-size:14px}.tabs,.choices{display:flex;gap:8px;margin:18px 0}.tabs button,.choices button{flex:1;border:1px solid var(--line);background:#fff;padding:12px;color:var(--ink);font-weight:800;text-align:left;cursor:pointer}.tabs .on,.choices .on{background:var(--ink);color:#fff;box-shadow:inset 0 -4px var(--red)}.choices small{display:block;margin-top:6px;font-weight:400;opacity:.75}.label{font-weight:800;margin-top:26px}.hint{font-size:13px;color:#687583;margin:6px 0 12px}.zone{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));width:min(420px,calc(100vw - 44px));height:min(420px,calc(100vw - 44px));margin:auto;border-top:1px solid #9fa6aa;border-left:1px solid #9fa6aa}.zone button{aspect-ratio:1;min-height:0;border:0;border-right:1px solid #9fa6aa;border-bottom:1px solid #9fa6aa;background:#fff;cursor:pointer}.zone .range{background:#f7d2b9}.zone .chosen{background:#e98245;color:#fff;font-size:22px}.zone.pitch .chosen{background:#bf5a10}.zone .actual{outline:3px solid #12345a;outline-offset:-4px;background:#b8d5ed}.action{width:100%;border:0;background:var(--red);color:#fff;padding:17px;margin:22px 0 12px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #8f251e}.result{padding:13px;border-left:4px solid var(--red);background:#f0e6d2;font-weight:800;min-height:48px}.resultArt{display:none;position:relative;margin-top:12px;aspect-ratio:2.15;border-radius:8px;overflow:hidden;background-image:linear-gradient(90deg,rgba(17,35,63,.62),transparent 62%),url('pitchit-result-sprite.png');background-size:auto 100%;background-position:0 center;box-shadow:0 8px 20px #11233f24}.resultArt.show{display:block}.resultArt b{position:absolute;left:18px;bottom:15px;color:#fff;font-size:22px;letter-spacing:.04em;text-shadow:0 2px 4px #000}.resultArt.strike,.resultArt.ball{background-position:0 center}.resultArt.out{background-position:33.33% center}.resultArt.hit{background-position:100% center}.resultArt.homerun{background-position:100% center;filter:saturate(1.35)}.reveal{text-align:center;font-weight:800;color:#12345a;font-size:13px}.count{display:flex;justify-content:center;gap:25px;background:var(--ink);color:#fff;margin:28px -22px -22px;padding:14px;font-weight:800}@media(max-width:560px){.choices{flex-wrap:wrap}.choices button{min-width:calc(50% - 4px)}.app{padding:18px}.count{margin:28px -18px -18px}.zone{width:min(340px,calc(100vw - 36px));height:min(340px,calc(100vw - 36px))}}
  </style>
</head>
<body>
  <main class="app"><div class="brand"><img src="pitchit-logo-v2.png" alt="PITCHIT" /></div><h1 id="title">타격 작전</h1><p class="sub" id="description">스윙 유형과 노림 칸을 선택하세요.</p><div class="tabs"><button id="batTab" class="on">타격</button><button id="pitchTab">투구</button></div><div class="label" id="stepOne">1. 스윙 유형</div><p class="hint" id="hintOne">컨택 스윙은 선택 칸 주변 3×3, 총 9칸을 공략합니다.</p><div class="choices" id="choices"></div><div class="label" id="stepTwo">2. 노림 칸</div><p class="hint" id="hintTwo">투구 위치와 가까울수록 정확한 타격이 됩니다.</p><div class="zone" id="zone"></div><p class="reveal" id="reveal"></p><button class="action" id="action">이 칸을 노리고 스윙</button><p class="result" id="result">준비 완료. 첫 작전을 선택하세요.</p><div class="resultArt" id="resultArt"><b></b></div><div class="count">B <span id="balls">0</span> &nbsp; S <span id="strikes">0</span> &nbsp; O <span id="outs">0</span></div></main>
  <script>
    const state={role:'bat',swing:'contact',type:'fastball',target:[2,2],last:null,b:0,s:0,o:0};
    const swings=[['power','파워 스윙','중심 + 상하좌우 5칸'],['contact','컨택 스윙','주변 3×3 · 9칸'],['vertical','세로 노려치기','같은 세로줄 공략'],['horizontal','가로 노려치기','같은 가로줄 공략'],['spot','스팟 스윙','한 칸 정밀 공략']];
    const pitchTypes=[['fastball','직구','스윙 유도↓ · 장타 위험↓'],['breaking','변화구','스윙 유도↑ · 장타 위험↑']];
    const $=id=>document.getElementById(id), dist=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
    function inRange(z){const t=state.target,d=dist(z,t);if(state.swing==='contact')return Math.abs(z[0]-t[0])<=1&&Math.abs(z[1]-t[1])<=1;if(state.swing==='power')return d<=1;if(state.swing==='vertical')return z[1]===t[1];if(state.swing==='horizontal')return z[0]===t[0];return d===0}
    function render(){const bat=state.role==='bat';$('title').textContent=bat?'타격 작전':'투구 작전';$('description').textContent=bat?'볼에는 스윙하지 않습니다.':'투구 뒤 상대 타자의 노림 칸이 공개됩니다.';$('batTab').className=bat?'on':'';$('pitchTab').className=!bat?'on':'';$('stepOne').textContent=bat?'1. 스윙 유형':'1. 구종 선택';$('hintOne').textContent=bat?'컨택 스윙은 선택 칸 주변 3×3, 총 9칸을 공략합니다.':'직구는 장타 위험이 낮고, 변화구는 헛스윙을 더 유도합니다.';$('stepTwo').textContent=bat?'2. 노림 칸':'2. 투구 위치';$('hintTwo').textContent=bat?'투구 위치와 가까울수록 정확한 타격이 됩니다.':'가장자리일수록 볼 또는 제구 이탈 가능성이 높습니다.';$('choices').innerHTML=(bat?swings:pitchTypes).map(x=>`<button data-id="${x[0]}" class="${(bat?state.swing:state.type)===x[0]?'on':''}">${x[1]}<small>${x[2]}</small></button>`).join('');document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>{bat?state.swing=b.dataset.id:state.type=b.dataset.id;render()});const selected=bat?state.target:state.target;$('zone').className='zone '+(bat?'':'pitch');$('zone').innerHTML=Array.from({length:25},(_,i)=>{const z=[Math.floor(i/5),i%5],on=z[0]===selected[0]&&z[1]===selected[1],actual=state.last&&z[0]===state.last[0]&&z[1]===state.last[1];return `<button class="${on?'chosen':''} ${bat&&!on&&inRange(z)?'range':''} ${actual?'actual':''}" data-z="${z}">${on?'●':''}</button>`}).join('');document.querySelectorAll('#zone button').forEach(b=>b.onclick=()=>{state.target=b.dataset.z.split(',').map(Number);state.last=null;render()});$('action').textContent=bat?'이 칸을 노리고 스윙':`${state.type==='fastball'?'직구':'변화구'}로 이 칸에 투구`;$('reveal').textContent=state.last?(bat?'파란 테두리 · 실제 투구 위치':'파란 테두리 · 상대 타자의 노림 칸'):'';$('balls').textContent=state.b;$('strikes').textContent=state.s;$('outs').textContent=state.o}
    function play(){const bat=state.role==='bat';const opponent=[Math.floor(Math.random()*5),Math.floor(Math.random()*5)];state.last=opponent;const match=bat&&inRange(opponent),edge=Math.max(Math.abs(opponent[0]-2),Math.abs(opponent[1]-2)),ball=Math.random()<.08+edge*.12;if(ball){state.b=Math.min(4,state.b+1);$('result').textContent='볼 — 볼에는 스윙이 없습니다.'}else if(!bat){$('result').textContent=`${state.type==='fastball'?'직구':'변화구'} 투구 완료 — 상대 노림 칸을 확인하세요.`}else{const hit=Math.random()<(match?.66:.30);if(hit)$('result').textContent=Math.random()<.17?'홈런! 노린 존을 완벽히 공략했습니다.':'안타! 타격이 살아났습니다.';else{state.s=Math.min(3,state.s+1);$('result').textContent='스트라이크 · 타이밍을 다시 맞춰보세요.'}}render()}
    $('batTab').onclick=()=>{state.role='bat';state.last=null;render()};$('pitchTab').onclick=()=>{state.role='pitch';state.last=null;render()};$('action').onclick=play;render();
  </script>
  <script>
    function showOutcome(kind, text) {
      const art = document.getElementById('resultArt');
      art.className = `resultArt show ${kind}`;
      art.querySelector('b').textContent = text;
      document.getElementById('result').textContent = text;
    }
    document.getElementById('action').onclick = () => {
      const bat = state.role === 'bat';
      const pitch = [Math.floor(Math.random() * 5), Math.floor(Math.random() * 5)];
      state.last = pitch;
      if (!bat) {
        const names = state.type === 'fastball' ? ['스트라이크', '땅볼 아웃', '뜬공 아웃'] : ['헛스윙 삼진', '파울', '안타'];
        const result = names[Math.floor(Math.random() * names.length)];
        showOutcome(result.includes('아웃') || result.includes('삼진') ? 'out' : result === '안타' ? 'hit' : 'strike', `${result} · 상대 노림 칸을 공개합니다.`);
      } else {
        const matched = inRange(pitch);
        const roll = Math.random();
        if (roll < .14) { state.b = Math.min(4, state.b + 1); showOutcome('ball', '볼 · 존을 벗어난 공입니다.'); }
        else if (roll > (matched ? .42 : .70)) {
          const outcomes = ['안타', '2루타', '3루타', '홈런'];
          const result = outcomes[Math.min(3, Math.floor(Math.random() * 4))];
          showOutcome(result === '홈런' ? 'homerun' : 'hit', `${result}! 노린 코스를 공략했습니다.`);
        } else if (roll < .32) { state.s = Math.min(3, state.s + 1); showOutcome('strike', state.s >= 3 ? '삼진 아웃 · 타이밍을 놓쳤습니다.' : '스트라이크 · 다음 공을 노려보세요.'); }
        else { showOutcome('out', Math.random() < .5 ? '땅볼 아웃 · 수비 정면입니다.' : '뜬공 아웃 · 높이 떴습니다.'); }
      }
      render();
    };
  </script>
</body>
</html>
