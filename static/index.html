<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PITCHIT</title>
<style>
:root{--navy:#102846;--red:#e33b31;--line:#cbd7e4}*{box-sizing:border-box}body{margin:0;background:#f6f9fc;color:var(--navy);font-family:Arial,"Noto Sans KR",sans-serif}.app{width:min(1120px,calc(100% - 32px));min-height:calc(100vh - 32px);margin:16px auto;background:#fff;border:1px solid #d4dfeb;box-shadow:0 18px 48px #11233f18;overflow:hidden}.home{min-height:calc(100vh - 32px);padding:92px 68px;background:linear-gradient(90deg,#fff 0%,#fff 47%,#ffffffba 68%,#ffffff10 100%),url("pitchit-hero-white.png") right center/cover no-repeat}.brand{width:220px;height:76px;overflow:hidden;border-radius:8px;background:#000}.brand img{width:220px;transform:translateY(-68px)}.eyebrow{color:var(--red);font-size:12px;letter-spacing:.23em;font-weight:900;margin:30px 0 10px}.home h1{font-size:clamp(48px,7vw,76px);line-height:.96;margin:0;letter-spacing:-.06em}.home h1 em{font-style:normal;color:var(--red)}.lead{margin:20px 0 0;font-size:16px;white-space:nowrap}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(760px,100%);margin-top:44px}.mode{border:0;min-height:142px;padding:22px;text-align:left;font-size:20px;font-weight:900;cursor:pointer;transition:.18s transform,.18s box-shadow;box-shadow:0 7px 0 #b6c1ce}.mode small{display:block;margin-top:9px;font-size:13px;font-weight:400;opacity:.83}.mode:hover{transform:translateY(-6px);box-shadow:0 13px 0 #8c9bab}.mode:active{transform:translateY(2px);box-shadow:0 3px 0 #8c9bab}.solo{background:var(--red);color:#fff;box-shadow:0 7px 0 #9a2721}.quick{background:var(--navy);color:#fff;box-shadow:0 7px 0 #06172a}.friend{background:#f3f6fa;color:var(--navy)}.game{display:none;padding:26px}.game.show{display:block}.top{display:flex;align-items:center;gap:18px;border-bottom:2px solid var(--navy);padding-bottom:14px}.back{border:1px solid var(--line);background:#fff;padding:9px 12px;color:var(--navy);font-weight:800;cursor:pointer}.top h2{margin:0;font-size:22px}.board{display:grid;grid-template-columns:1fr 330px;gap:28px;margin-top:24px}.score{display:grid;grid-template-columns:80px 1fr 160px 80px;align-items:center;background:var(--navy);color:#fff;padding:15px}.score small{display:block;font-size:10px;letter-spacing:.14em;opacity:.7}.score b{font-size:30px}.bases{width:54px;height:54px;position:relative;margin:auto;transform:rotate(45deg)}.bases i{position:absolute;width:15px;height:15px;border:2px solid #b7c7d8}.bases i:nth-child(1){left:19px;top:0}.bases i:nth-child(2){left:0;top:19px}.bases i:nth-child(3){right:0;top:19px}.bases i.on{background:#f2bc39;border-color:#fff}.counts{display:flex;gap:8px;justify-content:center}.counts span{border:1px solid #70869d;border-radius:50%;width:37px;height:37px;display:grid;place-items:center;font-size:11px}.counts b{font-size:15px}.panel{padding:22px;border:1px solid #d9e2ec}.panel h3{margin:0 0 8px}.hint{color:#607286;font-size:13px;margin:0 0 18px}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.types button{border:1px solid var(--line);background:#fff;padding:12px;text-align:left;font-weight:800;cursor:pointer}.types button.on{background:var(--navy);color:#fff;box-shadow:inset 0 -4px var(--red)}.zoneWrap{position:relative;width:min(450px,100%);aspect-ratio:1;margin:18px auto;background:#fff}.zone{position:absolute;left:0;top:0;width:100%;height:100%;display:grid;grid-template:repeat(5,1fr)/repeat(5,1fr);background:#fffc;border:2px solid var(--navy)}.zone button{border:0;border-right:1px solid #7d91a5;border-bottom:1px solid #7d91a5;background:transparent;cursor:pointer;font-size:26px}.zone button:nth-child(5n){border-right:0}.zone button:nth-child(n+21){border-bottom:0}.zone .range{background:#f7d2b9a8}.zone .pick{background:#ea8044;color:#fff}.zone .ball{background:url("pitch-ball.png") center/70% no-repeat!important;color:transparent}.bases i.on:after{content:"";display:block;width:7px;height:7px;border-radius:50%;background:#e33b31;margin:2px auto}.action{width:100%;padding:17px;border:0;background:var(--red);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #95241e}.action:active{transform:translateY(3px);box-shadow:0 2px 0 #95241e}.result{min-height:52px;padding:14px;background:#f1f5f9;border-left:4px solid var(--red);font-weight:800}.art{display:none;margin-top:12px;height:130px;background:url("pitchit-result-sprite.png") right center/auto 100% no-repeat;border-radius:6px}.art.show{display:block}@media(max-width:760px){.home{padding:54px 28px}.lead{white-space:normal}.modes{grid-template-columns:1fr}.mode{min-height:90px}.board{grid-template-columns:1fr}.score{grid-template-columns:60px 1fr 140px 60px}.app{width:100%;margin:0;min-height:100vh;border:0}.game{padding:16px}}
.zoneWrap{padding:28px;background:url("pitchit-strike-zone-white.png") center/100% 100% no-repeat}.zone{left:14%;top:14%;width:72%;height:72%}.art{background-position:0 center}.art.strike,.art.ball{background-position:0 center}.art.out{background-position:33.33% center}.art.hit,.art.homerun{background-position:100% center}</style></head><body><main class="app"><section class="home" id="home"><div class="brand"><img src="pitchit-logo-v2.png"></div><p class="eyebrow">BASEBALL MIND GAME</p><h1>한 구에 담긴<br><em>읽고, 속이는 승부.</em></h1><p class="lead">5×5 스트라이크존에서 작전을 고르고, 상대의 심리를 읽어 승부하세요.</p><div class="modes"><button class="mode solo" data-mode="solo">싱글 플레이<small>AI와 타격·투구 연습</small></button><button class="mode quick" data-mode="quick">빠른 대전<small>AI 상대와 한 판 대결</small></button><button class="mode friend" data-mode="friend">친구와 플레이<small>같은 화면 턴 대결</small></button></div></section><section class="game" id="game"><div class="top"><button class="back" id="back">← 홈으로</button><h2 id="modeTitle">싱글 플레이</h2></div><div class="board"><div><section class="score"><div><small>INNING</small><b id="inning">1</b><small>초</small></div><div class="bases"><i id="b2"></i><i id="b3"></i><i id="b1"></i></div><div class="counts"><span>B<b id="balls">0</b></span><span>S<b id="strikes">0</b></span><span>O<b id="outs">0</b></span></div><div><small>SCORE</small><b id="runs">0</b></div></section><section class="panel"><h3>타격 작전</h3><p class="hint">스윙 유형을 고르고, 정확한 5×5 존에서 노릴 칸을 선택하세요.</p><div class="types" id="types"></div><div class="zoneWrap"><div class="zone" id="zone"></div></div><p class="hint" id="reveal">실제 투구 위치는 결과 후 ⚾로 표시됩니다.</p><button class="action" id="swing">이 칸을 노리고 스윙</button><p class="result" id="result">작전을 선택하세요.</p><div class="art" id="art"></div></section></div><aside class="panel"><h3>게임 안내</h3><p class="hint">컨택 스윙은 선택 칸 중심 3×3, 총 9칸을 공략합니다. 범위 밖 투구로는 안타나 홈런이 나오지 않습니다.</p></aside></div></section></main><script>
const state={mode:"",swing:"contact",pick:12,ball:null,b:0,s:0,o:0,r:0,bases:[0,0,0]};const swings=[["power","파워 스윙"],["contact","컨택 스윙"],["spot","스팟 스윙"]];const $=x=>document.getElementById(x);function inRange(i){let r=Math.floor(i/5),c=i%5,pr=Math.floor(state.pick/5),pc=state.pick%5,d=Math.abs(r-pr)+Math.abs(c-pc);return state.swing==="contact"?Math.abs(r-pr)<=1&&Math.abs(c-pc)<=1:state.swing==="power"?d<=1:state.swing==="vertical"?c===pc:state.swing==="horizontal"?r===pr:d===0}function render(){let play=!!state.mode;$("home").style.display=play?"none":"block";$("game").className=play?"game show":"game";if(!play)return;$("modeTitle").textContent=state.mode==="solo"?"싱글 플레이":state.mode==="quick"?"빠른 대전":"친구와 플레이";$("types").innerHTML=swings.map(x=>'<button class="'+(x[0]===state.swing?"on":"")+'" data-s="'+x[0]+'">'+x[1]+'</button>').join("");document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{state.swing=b.dataset.s;render()});$("zone").innerHTML=Array.from({length:25},(_,i)=>'<button class="'+(i===state.pick?"pick ":"")+(i!==state.pick&&inRange(i)?"range ":"")+(i===state.ball?"ball":"")+'" data-z="'+i+'">'+(i===state.ball?"⚾":i===state.pick?"●":"")+'</button>').join("");document.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{state.pick=+b.dataset.z;state.ball=null;render()});$("balls").textContent=state.b;$("strikes").textContent=state.s;$("outs").textContent=state.o;$("runs").textContent=state.r;["b1","b2","b3"].forEach((id,i)=>$(id).className=state.bases[i]?"on":"")}function start(mode){state.mode=mode;history.pushState({mode},"","#"+mode);render()}document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>start(b.dataset.mode));$("back").onclick=()=>{state.mode="";history.pushState({},"",location.pathname);render()};window.onpopstate=()=>{state.mode=location.hash.slice(1);render()};$("swing").onclick=()=>{let ball=Math.floor(Math.random()*25),hit=inRange(ball)&&Math.random()<.62;state.ball=ball;$("art").className="art show";if(!inRange(ball)){state.s++;if(state.s>=3){state.s=0;state.o++;$("result").textContent="삼진 아웃 · 노린 범위 밖의 공입니다."}else $("result").textContent="스트라이크 · 노린 범위 밖의 공입니다.";$("art").className="art show"}else if(hit){let x=Math.random(),kind=x>.93?"홈런":x>.78?"2루타":"안타";if(kind==="홈런"){state.r++;state.bases=[0,0,0]}else state.bases=kind==="2루타"?[0,1,0]:[1,0,0];$("result").textContent=kind+"! 노린 코스를 공략했습니다.";$("art").className="art show"}else{state.o++;$("result").textContent=Math.random()<.5?"땅볼 아웃":"뜬공 아웃";$("art").className="art show"}render();$("reveal").textContent="⚾ 실제 투구 위치가 표시됩니다."};state.mode=location.hash.slice(1);render();</script><script>$("swing").addEventListener("click",()=>{const t=$("result").textContent;const a=$("art");a.className="art show "+(t.includes("홈런")?"homerun":t.includes("안타")||t.includes("루타")?"hit":t.includes("땅볼")||t.includes("뜬공")||t.includes("삼진")?"out":t.includes("볼")?"ball":"strike")});</script><script>
const types=[{t:"컨택형",p:45,a:85,e:55,v:45},{t:"파워형",p:85,a:48,e:52,v:45},{t:"주루형",p:45,a:57,e:48,v:80},{t:"선구안형",p:48,a:58,e:82,v:42}];
const lineup=Array.from({length:9},(_,i)=>({...types[Math.floor(Math.random()*4)],n:`${i+1}번 타자`}));
state.turn=0;state.batter=lineup[0];state.inning=1;
document.querySelector("aside.panel").insertAdjacentHTML("beforeend",'<hr><h3>현재 타자</h3><div id="batcard"></div><h3>오늘의 타순</h3><div id="lineup"></div>');
const prior=render;
render=()=>{prior();if(!state.mode)return;$("inning").textContent=state.inning;$("batcard").innerHTML=`<b>${state.batter.n} · ${state.batter.t}</b><p class="hint">파워 ${state.batter.p} · 정확도 ${state.batter.a}<br>선구안 ${state.batter.e} · 주력 ${state.batter.v}</p>`;$("lineup").innerHTML=lineup.map((b,i)=>`<small${i===state.turn?' style="color:#e33b31;font-weight:900"':''}>${i+1}. ${b.t}</small>`).join("<br>")};
function nextBatter(){state.b=0;state.s=0;state.turn=(state.turn+1)%9;state.batter=lineup[state.turn]}
function advance(n){let next=[0,0,0];for(let i=2;i>=0;i--)if(state.bases[i]){let d=i+n;if(d>=3)state.r++;else next[d]=1}if(n>=4)state.r++;else next[n-1]=1;state.bases=next}
function walk(){if(state.bases[0]&&state.bases[1]&&state.bases[2])state.r++;if(state.bases[1])state.bases[2]=1;if(state.bases[0])state.bases[1]=1;state.bases[0]=1}
function changeSide(text){if(state.o<3)return text;state.o=0;state.b=0;state.s=0;state.bases=[0,0,0];state.inning++;return text+" · 3아웃, 이닝 종료"}
$("swing").onclick=()=>{const z=Math.floor(Math.random()*25),b=state.batter,good=inRange(z),edge=[0,4,20,24].includes(z),pitchBall=Math.random()<(edge?.38:.13);let out="",k="strike",end=false;state.ball=z;
if(pitchBall){state.b++;out="볼 · 스트라이크존 밖으로 벗어났습니다.";k="ball";if(state.b>=4){walk();out="볼넷 · 1루로 출루합니다.";end=true}}
else if(!good&&Math.random()<b.e/100){state.b++;out="볼 · 선구안으로 유인구를 골랐습니다.";k="ball";if(state.b>=4){walk();out="볼넷 · 1루로 출루합니다.";end=true}}
else if(!good){state.s++;out="헛스윙 스트라이크";k="strike";if(state.s>=3){state.o++;out="삼진 아웃";k="out";end=true}}
else{const contact=Math.min(.82,.30+b.a/130+(state.swing==="contact"?.13:state.swing==="spot"?.05:-.04));const roll=Math.random();if(roll>contact){if(state.s<2&&roll<contact+.18-b.a/500){state.s++;out="파울 · 타석은 계속됩니다.";k="strike"}else{state.s++;out="헛스윙 스트라이크";k="strike";if(state.s>=3){state.o++;out="삼진 아웃";k="out";end=true}}}else{const extra=.05+b.p/350+(state.swing==="power"?.09:0);if(roll<extra*.18){advance(4);out="홈런! 담장을 넘겼습니다.";k="homerun";end=true}else if(roll<extra*.55){advance(3);out="3루타! 주력까지 살렸습니다.";k="hit";end=true}else if(roll<extra){advance(2);out="2루타! 장타 코스를 만들었습니다.";k="hit";end=true}else if(roll<contact*.62){advance(1);out="안타! 노린 코스를 공략했습니다.";k="hit";end=true}else if(Math.random()<.52){if(Math.random()<b.v/260){advance(1);out="내야안타! 주력으로 1루에서 살았습니다.";k="hit"}else{state.o++;out="땅볼 아웃";k="out"}end=true}else{state.o++;out="뜬공 아웃";k="out";end=true}}}
if(end){out=changeSide(out);nextBatter()}$("result").textContent=out;$("art").className="art show "+k;render();$("reveal").textContent="⚾ 실제 투구 위치가 표시됩니다."};render();
</script></body></html>
